<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI診断レポート | 関内どうぶつクリニック</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:"Noto Sans JP",sans-serif;background:#0d1b2a;margin:0;padding:0}
.hdr{background:linear-gradient(135deg,#0d1b2a,#1a2e45);border-bottom:2px solid #c8a96e;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hico{width:32px;height:32px;background:linear-gradient(135deg,#1b7a6e,#22a090);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;cursor:pointer}
.htxt h1{font-size:13px;color:#f5f0e8;font-weight:700;margin:0}
.htxt p{color:#c8a96e;font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.main{max-width:800px;margin:0 auto;padding:14px 12px 60px}
.card{background:#faf8f5;border-radius:10px;padding:16px;margin-bottom:12px;border:1px solid #ddd8ce}
.ct{font-size:12px;font-weight:700;color:#1a2e45;margin-bottom:12px;display:flex;align-items:center;gap:7px;padding-bottom:8px;border-bottom:2px solid #f5f0e8}
.ci{width:24px;height:24px;background:linear-gradient(135deg,#1b7a6e,#22a090);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:9px;font-weight:700;color:#1b7a6e;letter-spacing:.06em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{padding:7px 9px;border:1.5px solid #ddd8ce;border-radius:6px;font-family:"Noto Sans JP",sans-serif;font-size:12px;color:#1a1a2e;background:white;outline:none}
.full{grid-column:1/-1}
.pvw{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pitem{position:relative;width:90px;height:68px;border-radius:6px;overflow:hidden;border:2px solid #ddd8ce}
.pitem img{width:100%;height:100%;object-fit:cover}
.pitem .dx{position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(180,60,60,.9);color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:12px;font-weight:bold;line-height:20px;text-align:center;padding:0}
.nt{display:none;margin-top:8px;padding:8px 12px;background:rgba(34,160,144,.1);border:1px solid rgba(34,160,144,.3);border-radius:6px;font-size:11px;color:#1b7a6e}
.nt.on{display:block}
.ba{width:100%;padding:14px;background:linear-gradient(135deg,#1b7a6e,#22a090);color:white;border:none;border-radius:10px;font-family:"Noto Sans JP",sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px}
.ba:disabled{opacity:.5;cursor:not-allowed}
.ld{display:none;text-align:center;padding:36px 20px;background:#faf8f5;border-radius:10px;margin-bottom:12px}
.ld.on{display:block}
.rn{width:44px;height:44px;border:4px solid rgba(27,122,110,.15);border-top-color:#22a090;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.rs{display:none}.rs.on{display:block}
.rh{background:linear-gradient(135deg,#1a2e45,#0d1b2a);color:#f5f0e8;border-radius:10px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:3px;margin-bottom:12px;background:#f5f0e8;padding:3px;border-radius:8px}
.tab{flex:1;padding:7px;border:none;border-radius:6px;font-family:"Noto Sans JP",sans-serif;font-size:11px;font-weight:600;cursor:pointer;color:#5a6270;background:transparent}
.tab.on{background:white;color:#1a2e45;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.tc{display:none}.tc.on{display:block}
.ab{background:white;border-radius:8px;padding:14px;border:1px solid #ddd8ce;font-size:11.5px;line-height:1.85;color:#1a1a2e;white-space:pre-wrap;max-height:360px;overflow-y:auto}
.pa{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.pp{padding:12px 14px;border:none;border-radius:9px;font-family:"Noto Sans JP",sans-serif;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sb{display:none;border-radius:6px;padding:9px 13px;font-size:11px;margin-top:10px}
.sb.on{display:block}
.sb.ok{background:rgba(34,160,144,.08);border:1px solid rgba(34,160,144,.25);color:#1b7a6e}
.sb.er{background:rgba(180,60,60,.08);border:1px solid rgba(180,60,60,.25);color:#b03030}
#pmo{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);flex-direction:column}
#pmo.on{display:flex}
#ptb{background:#1a2e45;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
#ptitle{color:white;font-size:11px;font-weight:600;flex:1}
#pprint{padding:7px 16px;background:#1b7a6e;color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold}
#pclose{padding:7px 12px;background:rgba(255,255,255,.2);color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px}
#pscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#pbody{background:white;max-width:210mm;margin:0 auto}
#kmo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#kmo.on{display:flex}
@media(max-width:560px){.pg{grid-template-columns:1fr 1fr}.pa{grid-template-columns:1fr}}
@media print{#pmo{display:flex!important;position:static!important;background:none!important}#ptb{display:none!important}#pscroll{overflow:visible!important}body>*:not(#pmo){display:none!important}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}
</style>
</head>
<body>

<div id="pmo">
  <div id="ptb"><span id="ptitle">プレビュー</span><button id="pprint" onclick="window.print()">🖨️ 印刷/PDF</button><button id="pclose" onclick="document.getElementById('pmo').classList.remove('on')">✕</button></div>
  <div id="pscroll"><div id="pbody"></div></div>
</div>

<div id="kmo">
  <div style="background:white;border-radius:14px;padding:24px;width:100%;max-width:420px">
    <div style="font-size:16px;font-weight:700;color:#1a2e45;margin-bottom:6px">🔑 APIキーの設定</div>
    <div style="font-size:11px;color:#666;margin-bottom:16px;line-height:1.7">AnthropicのAPIキーを入力してください。<br>キーはこのブラウザ内にのみ保存されます。</div>
    <input id="ki" type="password" placeholder="sk-ant-api03-..." autocomplete="off" style="width:100%;padding:11px;border:1.5px solid #c0cfe0;border-radius:8px;font-size:12px;font-family:monospace;box-sizing:border-box;margin-bottom:8px">
    <div id="kerr" style="display:none;color:#cc3333;font-size:11px;margin-bottom:8px">sk-ant- で始まるキーを入力してください</div>
    <div style="display:flex;gap:8px">
      <button onclick="saveKey()" style="flex:1;padding:11px;background:#1b7a6e;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">保存して使用する</button>
      <button onclick="document.getElementById('kmo').classList.remove('on')" style="padding:11px 16px;background:#f0ede8;color:#555;border:none;border-radius:8px;font-size:13px;cursor:pointer">閉じる</button>
    </div>
  </div>
</div>

<header class="hdr">
  <div class="hico" onclick="document.getElementById('kmo').classList.add('on')">🔑</div>
  <div class="htxt"><h1>AI 診断レポート生成</h1><p>Kannai Animal Clinic</p></div>
</header>

<main class="main">
  <div class="card">
    <div class="ct"><div class="ci">📋</div>患者・来院情報</div>
    <div class="pg">
      <div class="fg"><label>患者名</label><input id="petName" placeholder="例：ポチ"></div>
      <div class="fg"><label>動物種</label><select id="species"><option>犬</option><option>猫</option><option>うさぎ</option><option>鳥</option><option>その他</option></select></div>
      <div class="fg"><label>品種</label><input id="breed" placeholder="例：トイプードル"></div>
      <div class="fg"><label>年齢</label><input id="age" placeholder="例：6歳"></div>
      <div class="fg"><label>性別</label><select id="gender"><option>雄（去勢済）</option><option>雄（未去勢）</option><option>雌（避妊済）</option><option>雌（未避妊）</option></select></div>
      <div class="fg"><label>体重(kg)</label><input id="weight" placeholder="例：5.2"></div>
      <div class="fg"><label>オーナー名</label><input id="ownerName" placeholder="例：田中様"></div>
      <div class="fg"><label>検査日</label><input type="date" id="examDate"></div>
      <div class="fg"><label>担当獣医師</label><input id="vetName" placeholder="例：牛草先生"></div>
      <div class="fg full"><label>主訴・来院理由</label><textarea id="chief" rows="2" placeholder="例：食欲不振・元気消失2日"></textarea></div>
      <div class="fg full"><label>既往歴・服薬（任意）</label><textarea id="history" rows="2" placeholder="例：3年前に膀胱炎。現在投薬なし。"></textarea></div>
    </div>
  </div>

  <div class="card">
    <div class="ct"><div class="ci">🖼️</div>検査画像のアップロード</div>
    <p style="font-size:11px;color:#5a6270;margin-bottom:10px">検査結果票・カルテなどの画像を選択してください（複数可）</p>
    <!-- テストページ方法1と全く同じ実装 -->
    <input type="file" id="fi" accept="image/*" multiple onchange="onFileChange(this)" style="width:100%;padding:10px;border:2px solid #ddd8ce;border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:13px;background:white;cursor:pointer;box-sizing:border-box">
    <div class="pvw" id="pvw"></div>
    <div id="rdwrap" style="display:none;margin-top:9px">
      <button id="rdbtn" onclick="doReadInfo()">🔍 画像から患者情報を読み取る</button>
    </div>
    <div class="nt" id="ntc"></div>
  </div>

  <button class="ba" id="abt" onclick="startAnalysis()">
    <span style="font-size:17px">🧬</span>
    <div><div>AI解析を開始する</div><div style="font-size:9px;opacity:.8;font-weight:400;margin-top:1px">鑑別診断・次の検査提案レポートを生成します</div></div>
  </button>

  <div class="ld" id="ld"><div class="rn"></div><div id="lst" style="font-size:12px;color:#1b7a6e;font-weight:500">解析中...</div></div>

  <div class="rs" id="rs">
    <div class="rh">
      <div><div style="font-size:14px;font-weight:700">解析完了</div><div id="rmt" style="font-size:9px;color:#c8a96e;margin-top:2px"></div></div>
      <div style="background:rgba(34,160,144,.2);border:1px solid #22a090;color:#22a090;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700">✓ AI解析済み</div>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tab on" onclick="stab('vet')">🩺 獣医師用</button>
        <button class="tab" onclick="stab('own')">👨‍👩‍👧 オーナー向け</button>
      </div>
      <div id="tv" class="tc on"><div style="display:flex;align-items:center;gap:9px;margin:3px 0 12px"><hr style="flex:1;border:none;border-top:1px solid #ddd8ce"><span style="font-size:9px;color:#5a6270;white-space:nowrap">獣医師・スタッフ専用</span><hr style="flex:1;border:none;border-top:1px solid #ddd8ce"></div><div class="ab" id="vb"></div></div>
      <div id="to" class="tc"><div style="display:flex;align-items:center;gap:9px;margin:3px 0 12px"><hr style="flex:1;border:none;border-top:1px solid #ddd8ce"><span style="font-size:9px;color:#5a6270;white-space:nowrap">オーナー様にお渡しする資料</span><hr style="flex:1;border:none;border-top:1px solid #ddd8ce"></div><div class="ab" id="ob"></div></div>
    </div>
    <div class="pa">
      <button class="pp" onclick="showPrev('vet')" style="background:linear-gradient(135deg,#1a2e45,#243b5a);color:#f5f0e8"><span style="font-size:18px">📄</span><div style="text-align:left">獣医師用PDF<span style="font-size:9px;opacity:.7;display:block;font-weight:400">プレビュー→印刷</span></div></button>
      <button class="pp" onclick="showPrev('own')" style="background:linear-gradient(135deg,#c8a96e,#d4a853);color:#0d1b2a"><span style="font-size:18px">📋</span><div style="text-align:left">オーナー向けPDF<span style="font-size:9px;opacity:.7;display:block;font-weight:400">プレビュー→印刷</span></div></button>
    </div>
    <div class="sb" id="sb"></div>
  </div>
</main>

<script>
var imgs = [], ad = {vet:'', own:''};
document.getElementById('examDate').value = new Date().toISOString().split('T')[0];

// ===== デバッグテストで動作確認済みの実装 =====
function onFileChange(input) {
  var files = input.files;
  if (!files || !files.length) return;
  var pending = files.length;
  for (var i = 0; i < files.length; i++) {
    (function(f) {
      if (!f.type.startsWith('image/')) { if(--pending<=0) doReadInfo(); return; }
      var reader = new FileReader();
      reader.onload = function(e) {
        imgs.push({name: f.name, data: e.target.result, type: f.type});
        renderImgs();
        if (--pending <= 0) doReadInfo();
      };
      reader.onerror = function() {
        if (--pending <= 0) doReadInfo();
      };
      reader.readAsDataURL(f);
    })(files[i]);
  }
}
// ===== ここまで =====

function renderImgs() {
  var pvw = document.getElementById('pvw');
  pvw.innerHTML = '';
  for (var i = 0; i < imgs.length; i++) {
    var div = document.createElement('div');
    div.className = 'pitem';
    var img = document.createElement('img');
    img.src = imgs[i].data;
    var btn = document.createElement('button');
    btn.className = 'dx';
    btn.textContent = '✕';
    btn.onclick = (function(idx){ return function(){ imgs.splice(idx,1); renderImgs(); }; })(i);
    div.appendChild(img);
    div.appendChild(btn);
    pvw.appendChild(div);
  }
  document.getElementById('rdwrap').style.display = imgs.length ? 'block' : 'none';
}

function stab(t) {
  document.querySelectorAll('.tab').forEach(function(el,i){ el.classList.toggle('on',(i===0&&t==='vet')||(i===1&&t==='own')); });
  document.querySelectorAll('.tc').forEach(function(c){ c.classList.remove('on'); });
  document.getElementById(t==='vet'?'tv':'to').classList.add('on');
}
function gv(id){ var el=document.getElementById(id); return el?el.value:''; }
function showNt(msg){ var n=document.getElementById('ntc'); n.textContent=msg; n.classList.add('on'); }
function showSb(msg,ok){ var b=document.getElementById('sb'); b.textContent=msg; b.className='sb on '+(ok?'ok':'er'); }

function getKey(){ return localStorage.getItem('vc_key')||''; }
function saveKey(){
  var k=document.getElementById('ki').value.trim();
  if(!k.startsWith('sk-ant-')){ document.getElementById('kerr').style.display='block'; return; }
  localStorage.setItem('vc_key',k);
  document.getElementById('kmo').classList.remove('on');
  document.getElementById('kerr').style.display='none';
  showSb('✓ APIキーを保存しました。',true);
}

function applyInfo(info){
  var map={petName:'患者名',breed:'品種',age:'年齢',weight:'体重',ownerName:'オーナー',vetName:'担当医',chief:'主訴',history:'既往歴'};
  var filled=[];
  Object.keys(map).forEach(function(f){ var el=document.getElementById(f); if(el&&info[f]&&info[f].trim()){el.value=info[f];filled.push(map[f]);} });
  if(info.examDate) document.getElementById('examDate').value=info.examDate;
  if(info.species){var s=document.getElementById('species');var o=Array.from(s.options).find(function(o){return o.value===info.species||info.species.includes(o.value);});if(o)s.value=o.value;}
  if(info.gender){var sg=document.getElementById('gender');var og=Array.from(sg.options).find(function(o){return info.gender.includes(o.value.substring(0,2));});if(og)sg.value=og.value;}
  return filled;
}

function imgBlocks(){
  return imgs.map(function(img){ return {type:'image',source:{type:'base64',media_type:img.type,data:img.data.split(',')[1]}}; });
}

function resizeBlocks(cb){
  if(!imgs.length){cb([]);return;}
  var res=new Array(imgs.length),done=0;
  imgs.forEach(function(img,i){
    var im=new Image();
    im.onload=function(){
      var W=im.width,H=im.height,MAX=1568;
      if(W<=MAX&&H<=MAX){res[i]={type:'image',source:{type:'base64',media_type:img.type,data:img.data.split(',')[1]}};if(++done===imgs.length)cb(res);return;}
      var s=Math.min(MAX/W,MAX/H);var cv=document.createElement('canvas');cv.width=Math.round(W*s);cv.height=Math.round(H*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);var rd=cv.toDataURL('image/jpeg',.85);
      res[i]={type:'image',source:{type:'base64',media_type:'image/jpeg',data:rd.split(',')[1]}};
      if(++done===imgs.length)cb(res);
    };
    im.onerror=function(){res[i]={type:'image',source:{type:'base64',media_type:img.type,data:img.data.split(',')[1]}};if(++done===imgs.length)cb(res);};
    im.src=img.data;
  });
}

function callAPI(messages,maxTokens,cb){
  var key=getKey();
  if(!key){ document.getElementById('kmo').classList.add('on'); cb(null,'APIキーが未設定です。'); return; }
  var ctrl=new AbortController();
  var tid=setTimeout(function(){ ctrl.abort(); },60000);
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTokens||4000,messages:messages}),
    signal:ctrl.signal
  }).then(function(r){clearTimeout(tid);return r.json();}).then(function(d){
    if(d.error){
      var msg=d.error.message;
      if(d.error.type==='authentication_error'){msg='APIキーが無効です。🔑から再入力してください。';document.getElementById('kmo').classList.add('on');}
      cb(null,msg);
    }else{ cb((d.content||[]).map(function(b){return b.text||'';}).join('')); }
  }).catch(function(e){ clearTimeout(tid); cb(null,e.name==='AbortError'?'タイムアウトしました。':e.message); });
}

function doReadInfo(){
  if(!imgs.length)return;
  var btn=document.getElementById('rdbtn'),abt=document.getElementById('abt');
  btn.disabled=true;btn.textContent='⏳ 読み取り中...';abt.disabled=true;
  showNt('🔍 画像から患者情報を読み取り中...');
  var done=false;
  var timer=setTimeout(function(){ if(done)return;done=true;btn.disabled=false;btn.textContent='🔍 再度読み取る';abt.disabled=false;showNt('⚠️ タイムアウト。手動で入力してください。'); },25000);
  resizeBlocks(function(iblocks){ callAPI([{role:'user',content:iblocks.concat([{type:'text',text:'あなたは動物病院の検査結果票・カルテの文字認識の専門家です。\n\n【最重要：項目の区別方法】\n- petName（患者名）= ペット・動物の名前。「ポチ」「タマ」「モコ」などペットの固有名詞。カルテに「患者名」「動物名」「ペット名」として記載される。\n- ownerName（オーナー名）= 飼い主・人間の名前。「様」「オーナー」「飼主」「owner」の近くに記載。苗字＋名前の形が多い。\n- breed（品種）= 動物の種類・品種名。「トイプードル」「柴犬」「アメリカンショートヘア」など。petNameと混同しないこと。\n- species（動物種）= 「犬」「猫」「うさぎ」「鳥」のいずれか。\n\n【全読み取り項目】\n1. petName: ペット・動物の固有名前のみ（人名ではない）\n2. species: 動物種（犬/猫/うさぎ/鳥/その他）\n3. breed: 品種名（petNameと混同しないこと）\n4. age: 年齢（例:6歳、2歳3ヶ月）\n5. gender: 性別（雄/雌/去勢済/避妊済）\n6. weight: 体重（kg数値のみ）\n7. ownerName: 飼い主・人間の名前（「様」の前の名前）\n8. examDate: 検査日（YYYY-MM-DD形式）\n9. vetName: 担当獣医師名（「Dr.」「担当」の近く）\n10. chief: 主訴・来院理由・症状\n11. history: 既往歴・投薬歴\n\n読み取れない項目は空文字。以下のJSONのみで返答（説明文不要）:\n{"petName":"","species":"","breed":"","age":"","gender":"","weight":"","ownerName":"","examDate":"","vetName":"","chief":"","history":""}'}])}],1500,function(txt,err){
    if(done)return;done=true;clearTimeout(timer);
    if(!err&&txt){try{var m=txt.replace(/```json|```/g,'').trim().match(/\{[\s\S]*\}/);if(m){var filled=applyInfo(JSON.parse(m[0]));showNt(filled.length?'✓ 読み取り完了: '+filled.join('・')+' を入力しました。':'⚠️ 読み取れませんでした。手動で入力してください。');}else{showNt('⚠️ 読み取りに失敗。手動で入力してください。');}}catch(e){showNt('⚠️ 読み取りに失敗。手動で入力してください。');}}
    else{showNt('⚠️ 自動読み取りに失敗。手動で入力してください。');}
    btn.disabled=false;btn.textContent='🔍 再度読み取る';abt.disabled=false;
  }); }); // end callAPI, end resizeBlocks
}

function startAnalysis(){
  if(!imgs.length&&!gv('chief')){ showSb('検査画像をアップロードするか、主訴を入力してください。',false);return; }
  var btn=document.getElementById('abt');btn.disabled=true;
  document.getElementById('ld').classList.add('on');document.getElementById('rs').classList.remove('on');
  function fail(msg){document.getElementById('ld').classList.remove('on');btn.disabled=false;showSb('❌ '+msg,false);}
  var pn=gv('petName')||'患者',sp=gv('species'),br=gv('breed'),ag=gv('age'),gn=gv('gender'),wt=gv('weight'),ow=gv('ownerName'),ed=gv('examDate'),vn=gv('vetName'),ch=gv('chief'),hi=gv('history');
  var pi='患者名: '+pn+'\n動物種: '+sp+'('+br+')\n年齢: '+ag+' 性別: '+gn+' 体重: '+wt+'kg\nオーナー: '+ow+'\n検査日: '+ed+'\n担当: '+vn+'\n主訴: '+ch+'\n既往歴: '+(hi||'なし');
  document.getElementById('lst').textContent='画像を準備中...';
  resizeBlocks(function(iblocks){
    document.getElementById('lst').textContent='獣医師用レポートを生成中...';
    var vtP='ベテラン獣医師のAIアシスタントとして、以下の患者情報と検査画像を解析し獣医師用診断レポートを日本語で作成してください。\n\n患者情報\n'+pi+'\n\n【1. 検査結果サマリー】各検査項目を表形式で整理。異常値を明確に示す。\n\n【2. 主要所見の評価】異常値の臨床的意義を詳細に解説。\n\n【3. 鑑別診断リスト（優先度順）】・第1候補: 病名、根拠、確率\n・第2候補\n・第3候補\n・除外すべき疾患\n\n【4. 次に推奨する検査】① 最優先: 検査名、理由、コスト・緊急度\n② 第2優先\n③ 第3優先\n\n【5. 治療方針の暫定提案】\n\n【6. モニタリング計画】\n\n【7. クライアントへの説明ポイント（5分版）】';
    callAPI([{role:'user',content:iblocks.concat([{type:'text',text:vtP}])}],4000,function(vt,err1){
      if(err1||!vt){fail('獣医師用レポート生成に失敗: '+(err1||'空のレスポンス'));return;}
      ad.vet=vt;document.getElementById('lst').textContent='オーナー向け資料を生成中...';
      var otP='関内どうぶつクリニックの獣医師AIアシスタントとして飼い主様向け説明資料を日本語で作成してください。\n\n患者情報\n'+pi+'\n\n【今日の検査について】\n【検査結果のわかりやすいまとめ】項目名|結果|基準値|状態\n【現在の状態について】\n【考えられる原因】\n【次のステップ】\n【ご自宅での注意事項】\n【よくあるご質問(Q&A)】Q1〜Q5\n【次回来院の目安】\n最後に温かみのある一言で。';
      callAPI([{role:'user',content:[{type:'text',text:otP+'\n\n参考(獣医師向け分析)\n'+vt.substring(0,2000)}]}],4000,function(ot,err2){
        if(err2||!ot){fail('オーナー向け資料生成に失敗: '+(err2||'空のレスポンス'));return;}
        ad.own=ot;
        document.getElementById('vb').textContent=vt;document.getElementById('ob').textContent=ot;
        document.getElementById('rmt').textContent='生成日時: '+new Date().toLocaleString('ja-JP')+'　患者: '+pn;
        document.getElementById('ld').classList.remove('on');document.getElementById('rs').classList.add('on');
        document.getElementById('rs').scrollIntoView({behavior:'smooth'});btn.disabled=false;
      });
    });
  });
}

function clean(s){return s.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/`/g,'').replace(/^#+\s*/,'').trim();}
function md2html(text,ac,hc){
  var lines=text.split('\n'),out='',rows=[],inT=false;
  function flush(){if(!rows.length)return;var t='<table style="width:100%;border-collapse:collapse;margin:2mm 0;font-size:8.5pt">';rows.forEach(function(row,ri){t+='<tr>';row.forEach(function(cell){t+=ri===0?'<th style="background:'+hc+';color:white;padding:2mm 2.5mm;text-align:left">'+cell+'</th>':'<td style="padding:2mm 2.5mm;border-bottom:0.5px solid #d0d8e4">'+cell+'</td>';});t+='</tr>';});out+=t+'</table>';rows=[];inT=false;}
  lines.forEach(function(line){
    var s=line.trim();
    if(s.startsWith('|')){inT=true;var c=s.split('|').slice(1,-1).map(function(c){return clean(c.trim());});if(!c.every(function(c){return /^[-: ]+$/.test(c);}))rows.push(c);return;}
    if(inT)flush();
    if(s.startsWith('【')&&s.includes('】')){out+='<div style="background:'+ac+';color:white;padding:2.5mm 4mm;margin:4mm 0 3mm;font-size:10pt;font-weight:bold;border-radius:2mm">'+clean(s)+'</div>';}
    else if(/^#{1,3}\s/.test(s)){out+='<div style="background:#e8f0f8;border-left:3px solid '+ac+';padding:2mm 3mm;margin:3mm 0 2mm;font-size:9pt;font-weight:bold">'+clean(s)+'</div>';}
    else if(s===''||s==='---'){out+='<div style="height:2mm"></div>';}
    else if(/^Q\d*[：:]/.test(s)){out+='<div style="font-weight:bold;color:'+hc+';margin-top:3mm;font-size:8.5pt">'+clean(s)+'</div>';}
    else if(/^A\d*[：:]/.test(s)){out+='<div style="color:#2d5a3d;padding-left:4mm;font-size:8.5pt">'+clean(s)+'</div>';}
    else if(/^[・①②③④⑤⑥⑦⑧⑨]/.test(s)||/^\d+[.、]/.test(s)){out+='<div style="padding-left:4mm;font-size:8.5pt">'+clean(s)+'</div>';}
    else{out+='<div style="font-size:8.5pt;margin:1mm 0">'+clean(s)+'</div>';}
  });
  if(inT)flush();return out;
}
